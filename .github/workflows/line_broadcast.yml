name: LINE Broadcast

on:
  # 本番の起動は cron-job.org から毎日 20:55（日本時間）に workflow_dispatch で行う。
  # GitHub の schedule は数時間遅れたり飛ばされたりするので、下の cron は保険。
  # 保険の実行は「今日（日本時間）すでに送信済み」または「日本時間 23 時以降」なら送らない
  schedule:
    - cron: "5 12 * * *"   # 21:05 JST
    - cron: "35 12 * * *"  # 21:35 JST
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: line-broadcast
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard (schedule only)
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "send=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          hour=$(TZ=Asia/Tokyo date +%H)
          if [ "$hour" -ge 23 ] || [ "$hour" -lt 12 ]; then
            echo "日本時間 ${hour} 時：送信時間帯を過ぎているので送らない"; echo "send=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # 今日（日本時間）の 12 時以降に「Send broadcast」まで成功した実行があれば送らない
          # （スキップしただけの実行も success になるので、手順単位で確認する）
          since=$(TZ=Asia/Tokyo date -d "today 12:00" -u +%Y-%m-%dT%H:%M:%SZ)
          ids=$(gh api "repos/${{ github.repository }}/actions/workflows/line_broadcast.yml/runs?status=success&created=>=${since}&per_page=20" \
            -q ".workflow_runs[] | select(.id != ${{ github.run_id }}) | .id")
          for id in $ids; do
            n=$(gh api "repos/${{ github.repository }}/actions/runs/${id}/jobs" \
              -q '[.jobs[].steps[] | select(.name == "Send broadcast" and .conclusion == "success")] | length')
            if [ "${n:-0}" -gt 0 ]; then
              echo "今日はすでに送信済み（run ${id}）"; echo "send=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          done
          echo "send=true" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        if: steps.guard.outputs.send == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Send broadcast
        if: steps.guard.outputs.send == 'true'
        env:
            LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
            # LINE_TEST_MODE: "true"
            # TEST_LINE_USER_ID: ${{ secrets.TEST_LINE_USER_ID }}
        run: |
          python daily_broadcast.py
