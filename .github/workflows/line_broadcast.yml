name: LINE Broadcast

on:
  # 本番の起動は cron-job.org から毎日 20:55（日本時間）に workflow_dispatch で行う。
  # GitHub の schedule は数時間遅れたり飛ばされたりするので、下の cron は保険。
  # 同じ日の2回目以降の配信は LINE 側が弾く（daily_broadcast.py が日付から決まる X-Line-Retry-Key を付ける）。
  # 保険の実行が大きく遅れて「日本時間 23 時以降」になった場合は送らない
  schedule:
    - cron: "5 12 * * *"   # 21:05 JST
    - cron: "35 12 * * *"  # 21:35 JST
  workflow_dispatch:
    inputs:
      # cron-job.org からの起動は入力なし = 本番配信。手動で確認するときだけ true にする
      test_mode:
        description: "テスト送信（TEST_LINE_USER_ID にだけ送る）"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: line-broadcast
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard (schedule only)
        id: guard
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "send=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          hour=$(TZ=Asia/Tokyo date +%H)
          if [ "$hour" -ge 23 ] || [ "$hour" -lt 12 ]; then
            echo "日本時間 ${hour} 時：送信時間帯を過ぎているので送らない"; echo "send=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "send=true" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        if: steps.guard.outputs.send == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 一言コメントの生成に使う（comment.py）
      - name: Install Claude Code
        if: steps.guard.outputs.send == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Send broadcast
        if: steps.guard.outputs.send == 'true'
        env:
            LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
            # 未設定・期限切れなら一言コメントなしで配信する
            CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
            LINE_TEST_MODE: ${{ inputs.test_mode }}
            TEST_LINE_USER_ID: ${{ secrets.TEST_LINE_USER_ID }}
        run: |
          python daily_broadcast.py
